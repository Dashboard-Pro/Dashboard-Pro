    <rect x="2" y="2" width="4" height="4" fill="#f5c542"/>
    <rect x="1" y="1" width="1" height="1" fill="#f5c542"/>
    <rect x="6" y="1" width="1" height="1" fill="#f5c542"/>
    <rect x="1" y="6" width="1" height="1" fill="#f5c542"/>
    <rect x="6" y="6" width="1" height="1" fill="#f5c542"/>
    <rect x="3" y="3" width="2" height="2" fill="#9a6212"/>
