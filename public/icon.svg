  <rect x="0.5" y="0.5" width="11" height="11" rx="1.6" fill="none" stroke="#243020" stroke-width="0.5"/>
  <g transform="translate(2 2)">
    <rect x="3" width="2" height="8" fill="#f5c542"/>
